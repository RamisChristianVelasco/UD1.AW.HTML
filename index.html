    <title>PÀGINES WEB</title>

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .contenedor {
            background: white;
            padding: 45px;
            width: 350px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            text-align: center;
        }

        h1 {
            color: #243b55;
            margin-bottom: 10px;
        }

        p {
            color: #777;
            margin-bottom: 30px;
        }

        ol {
            list-style: none;
            padding: 0;
        }

        li {
            margin: 12px 0;
        }

        a {
            display: block;
            text-decoration: none;
            color: white;
            background: linear-gradient(90deg, #4776e6, #8e54e9);
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
        }

        a:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(71,118,230,0.4);
        }
    </style>
</head>
